apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  labels:
    app: swagger-ui
  name: swagger-ui
spec:
  ingressClassName: nginx
  rules:
    - host: huly.example
      http:
        paths:
          - backend:
              service:
                name: swagger-ui
                port:
                  number: 80
            path: /_api-docs(/|$)(.*)
            pathType: ImplementationSpecific
