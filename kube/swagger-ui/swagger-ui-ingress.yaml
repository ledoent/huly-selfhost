apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
  labels:
    app: swagger-ui
  name: swagger-ui
spec:
  ingressClassName: nginx
  rules:
    - host: huly.hz.ledoweb.com
      http:
        paths:
          - backend:
              service:
                name: swagger-ui
                port:
                  number: 80
            path: /_api-docs
            pathType: Prefix
  tls:
    - hosts:
        - huly.hz.ledoweb.com
      secretName: huly-tls
