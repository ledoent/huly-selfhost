{{- if .Values.kvs.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kvs
  labels:
    {{- include "huly.labels" . | nindent 4 }}
    app: kvs
spec:
  replicas: {{ .Values.kvs.replicas }}
  selector:
    matchLabels:
      app: kvs
  template:
    metadata:
      annotations:
        {{- include "huly.checksumAnnotations" . | nindent 8 }}
      labels:
        {{- include "huly.labels" . | nindent 8 }}
        app: kvs
    spec:
      {{- include "huly.scheduling" . | nindent 6 }}
      initContainers:
        {{- include "huly.waitForCockroach" . | nindent 8 }}
      containers:
        - name: kvs
          image: {{ .Values.kvs.image | default (printf "%s/hulykvs:%s" .Values.hulyRegistry (.Values.kvs.version | default .Values.hulyVersion)) }}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8094
          env:
            {{- include "huly.envSecret" (dict "name" "HULY_DB_CONNECTION" "key" "CR_DB_URL" "root" .) | nindent 12 }}
            {{- include "huly.envSecret" (dict "name" "HULY_TOKEN_SECRET" "key" "SERVER_SECRET" "root" .) | nindent 12 }}
            {{- /*
              hulylake (kvs from v0.7.423) talks to S3 via the AWS SDK and
              expects an explicit region, plus a custom endpoint when the
              S3 backend is an S3-compatible service (Hetzner/MinIO/etc.).
              `HULY_S3_BUCKET` is read by hulylake's config crate (`HULY_`
              prefix → `s3_bucket` field).
            */}}
            {{- if eq .Values.storage.type "s3" }}
            - name: AWS_REGION
              value: {{ .Values.storage.s3.region | quote }}
            {{- with .Values.storage.s3.endpoint }}
            - name: AWS_ENDPOINT_URL_S3
              value: {{ . | quote }}
            {{- end }}
            {{- include "huly.envSecret" (dict "name" "AWS_ACCESS_KEY_ID" "key" "S3_ACCESS_KEY" "root" .) | nindent 12 }}
            {{- include "huly.envSecret" (dict "name" "AWS_SECRET_ACCESS_KEY" "key" "S3_SECRET_KEY" "root" .) | nindent 12 }}
            - name: HULY_S3_BUCKET
              value: {{ .Values.kvs.s3.bucket | quote }}
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: 8094
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8094
            initialDelaySeconds: 15
            periodSeconds: 30
          {{- with .Values.kvs.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
